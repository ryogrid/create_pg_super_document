<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    >
    <title>
      {% if page.title %}{{ page.title | escape }} - {% endif %}
      {% if site.title %}{{ site.title | escape }}{% else %}Documentation{% endif %}
    </title>
    {% if site.description %}
    <meta name="description" content="{{ site.description | escape }}">
    {% endif %}
    <style>
      :root {
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --link: #2563eb;
        --maxw: 980px;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Ubuntu, Cantarell, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--text);
        line-height: 1.65;
      }
      .container {
        max-width: var(--maxw);
        margin: 0 auto;
        padding: 1.25rem 1rem 2rem;
      }
      a { color: var(--link); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .doc-footer {
        margin-top: 3rem;
        padding: 1.25rem 0;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.95rem;
      }
      .doc-footer__list {
        margin: 0.25rem 0 0;
        padding-left: 1.2rem;
      }
    </style>
  </head>
  <body>
    <main role="main">
      <div class="container">
        <h1><strong>PostgreSQL LLM Generated Symbol Documents</strong></h1><br>
        {{ content }}
        {% include doc-footer.html %}
      </div>
    </main>
  </body>
</html>
