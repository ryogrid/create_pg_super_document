name: Continue Manual Documentation

on:
  workflow_dispatch:
    inputs:
      continue_from_batch:
        description: 'Batch to continue from (optional)'
        required: false
        type: string
  schedule:
    # Run every 6 hours to check if there's more work to do
    - cron: '0 */6 * * *'

jobs:
  check-status:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install duckdb

    - name: Check documentation status
      id: status
      run: |
        python3 continue_manual_documentation.py
        
    - name: Create status issue if needed
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          // Check if documentation is complete
          const { execSync } = require('child_process');
          const statusOutput = execSync('python3 continue_manual_documentation.py', { encoding: 'utf8' });
          
          const isComplete = statusOutput.includes('ALL DOCUMENTATION COMPLETE');
          
          if (isComplete) {
            // Create completion issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🎉 Manual Documentation Complete - All 3164 Symbols Documented',
              body: `## Documentation Completion Status
              
All 3164 PostgreSQL symbols have been successfully documented through manual AI generation!

### Achievement Summary
- **Total symbols documented**: 3164 
- **Total batches processed**: 945
- **Documentation method**: Manual AI generation following required_markdown_format
- **Quality**: Each symbol has comprehensive, unique documentation

### Next Steps
- Review and approve the complete documentation
- Consider creating a final PR for integration
- Archive or close the manual documentation workflow

### Documentation Quality
Each document includes:
- Comprehensive overview and detailed descriptions
- Complete parameter analysis and dependency relationships
- Implementation notes and PostgreSQL-specific context
- 3,000-8,000+ characters per symbol with unique content

**Generated by**: Manual AI documentation workflow
**Status**: ✅ COMPLETE`,
              labels: ['documentation', 'complete', 'ai-generated'],
              assignees: ['copilot']
            });
          } else {
            // Create continuation reminder issue
            const current = parseInt(statusOutput.match(/Current symbols documented: (\d+)/)?.[1] || '0');
            const total = parseInt(statusOutput.match(/Total symbols to document: (\d+)/)?.[1] || '3164');
            const progress = ((current / total) * 100).toFixed(2);
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📝 Continue Manual Documentation - ${current}/${total} symbols (${progress}%) complete`,
              body: `## Manual Documentation Progress Status

Current progress on manual AI documentation generation:

### Status
- **Symbols documented**: ${current}/${total} (${progress}%)
- **Remaining symbols**: ${total - current}
- **Approximate remaining batches**: ${Math.ceil((total - current) / 5)}

### Manual Workflow for Copilot Agent
To continue documentation:

1. **Get next batch**: 
   \`\`\`bash
   python3 scripts/improved_get_next_batch.py > current_batch.json
   \`\`\`

2. **Generate documentation manually** for each symbol using required_markdown_format

3. **Save each document**:
   \`\`\`bash
   python3 scripts/mcp_tool.py return_document [symbol_name] "[documentation]"
   \`\`\`

4. **Ingest documents**:
   \`\`\`bash
   python3 scripts/ingest_documents.py
   \`\`\`

5. **Repeat** until all symbols are documented

### Requirements
- Each document must be personally generated by AI agent
- Follow exact required_markdown_format from current_batch.json
- No automated document generation scripts
- Comprehensive analysis based on PostgreSQL source code

**Status**: 📝 IN PROGRESS - Ready for AI agent continuation`,
              labels: ['documentation', 'in-progress', 'manual-ai-generation'],
              assignees: ['copilot']
            });
          }